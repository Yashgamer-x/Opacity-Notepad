name: JavaFX Packaging

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  # ================= LINUX JOB =================
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: 'maven'
        
    - name: Install packaging dependencies
      run: |
        sudo apt update
        sudo apt install -y fakeroot dpkg-dev zip
        
    - name: Extract Maven Project Info
      id: project_info
      run: |
        APP_NAME=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        APP_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
        echo "TAG_NAME=v$APP_VERSION" >> $GITHUB_ENV

    # Removed jlink execution since Spring cannot be processed by it
    - name: Build
      run: |
        mvn clean package
        mkdir -p target/app/libs
        cp "target/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.jar" target/app/libs/

    # Removed --runtime-image flag so jpackage can resolve modules on its own
    - name: Native image
      run: |
        jpackage \
        --type app-image \
        --name "Opacity Notepad" \
        --app-version "${{ env.APP_VERSION }}" \
        --input target/app/libs \
        --main-jar "${{ env.APP_NAME }}-${{ env.APP_VERSION }}.jar" \
        --main-class org.yashgamerx.notepad.Launcher \
        --dest target/native \
        --icon src/main/resources/icon.png \
        --vendor "Yash Desai"

    - name: Zip native
      run: |
        cd target/native
        zip -r ../sendit-linux.zip *

    # Removed --runtime-image flag here as well
    - name: Debian installer
      run: |
        jpackage \
        --type deb \
        --name "Opacity Notepad" \
        --app-version "${{ env.APP_VERSION }}" \
        --input target/app/libs \
        --main-jar "${{ env.APP_NAME }}-${{ env.APP_VERSION }}.jar" \
        --main-class org.yashgamerx.notepad.Launcher \
        --dest target/installer \
        --icon src/main/resources/icon.png \
        --vendor "Yash Desai"

    - name: Upload Linux release assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Release ${{ env.APP_NAME }} ${{ env.APP_VERSION }}"
        files: |
          target/sendit-linux.zip
          target/installer/*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ================= WINDOWS JOB =================
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: 'maven'

    - name: Extract Maven Project Info
      id: project_info
      shell: bash
      run: |
        APP_NAME=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
        APP_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
        echo "TAG_NAME=v$APP_VERSION" >> $GITHUB_ENV

    # Removed jlink execution here as well
    - name: Build
      shell: bash
      run: |
        mvn clean package
        mkdir -p target/app/libs
        cp "target/${{ env.APP_NAME }}-${{ env.APP_VERSION }}.jar" target/app/libs/

    # Removed --runtime-image flag so jpackage uses JDK system modules
    - name: Windows EXE Installer
      shell: bash
      run: |
        jpackage \
        --type exe \
        --name "Opacity Notepad" \
        --app-version "${{ env.APP_VERSION }}" \
        --input target/app/libs \
        --main-jar "${{ env.APP_NAME }}-${{ env.APP_VERSION }}.jar" \
        --main-class org.yashgamerx.notepad.Launcher \
        --dest target/installer \
        --icon src/main/resources/icon.ico \
        --vendor "Yash Desai" \
        --win-shortcut \
        --win-menu

    # Removed --runtime-image flag here as well
    - name: Windows MSI Installer
      shell: bash
      run: |
        jpackage \
        --type msi \
        --name "Opacity Notepad" \
        --app-version "${{ env.APP_VERSION }}" \
        --input target/app/libs \
        --main-jar "${{ env.APP_NAME }}-${{ env.APP_VERSION }}.jar" \
        --main-class org.yashgamerx.notepad.Launcher \
        --dest target/installer \
        --icon src/main/resources/icon.ico \
        --vendor "Yash Desai"

    - name: Upload Windows release assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Release ${{ env.APP_NAME }} ${{ env.APP_VERSION }}"
        files: |
          target/installer/*.exe
          target/installer/*.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
